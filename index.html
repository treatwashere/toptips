<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boxicons — High Quality Web Icons</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#121212] text-gray-200 min-h-screen flex flex-col font-sans antialiased selection:bg-[#cbf33d] selection:text-black">

  <!-- Boxicons Top Navbar -->
  <header class="border-b border-[#222222] bg-[#121212]/90 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="#" class="flex items-center gap-2.5 group">
        <div class="w-8 h-8 bg-white text-black rounded-lg flex items-center justify-center font-black text-xl tracking-tighter group-hover:bg-[#cbf33d] transition">
          b
        </div>
        <span class="text-xl font-bold text-white tracking-tight">boxicons</span>
      </a>

      <!-- Center / Right Links -->
      <nav class="flex items-center gap-6 text-sm font-medium text-gray-400">
        <a href="#" class="text-white hover:text-[#cbf33d] transition">Icons</a>
        <a href="#" class="hover:text-white transition hidden sm:inline-block">Usage</a>
        <a href="#" class="hover:text-white transition hidden sm:inline-block">Font</a>
        <a href="https://github.com" target="_blank" class="bg-[#222] hover:bg-[#333] text-white px-3.5 py-1.5 rounded-lg border border-gray-700/60 transition text-xs font-semibold flex items-center gap-2">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
          GitHub
        </a>
      </nav>

    </div>
  </header>

  <!-- Hero Banner -->
  <section class="py-12 px-4 text-center border-b border-[#1f1f1f] bg-[#151515]">
    <div class="max-w-3xl mx-auto space-y-3">
      <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight">
        High Quality Web Icons
      </h1>
      <p class="text-gray-400 text-sm sm:text-base max-w-xl mx-auto">
        Simple, open source icons carefully crafted for designers & developers.
      </p>
    </div>
  </section>

  <!-- Main Container -->
  <main class="max-w-[1400px] w-full mx-auto px-4 sm:px-6 py-8 flex-1 space-y-6">

    <!-- Boxicons Style Controls Toolbar -->
    <div class="flex flex-col md:flex-row items-center justify-between gap-4 bg-[#1a1a1a] p-2.5 rounded-2xl border border-[#262626]">
      
      <!-- Style Tabs (Regular / Solid / Logos) -->
      <div class="flex items-center bg-[#111] p-1 rounded-xl border border-[#222] text-xs font-semibold text-gray-400 w-full md:w-auto">
        <button class="flex-1 md:flex-none px-5 py-2 rounded-lg bg-[#222] text-white shadow">Regular</button>
        <button class="flex-1 md:flex-none px-5 py-2 rounded-lg hover:text-gray-200 transition">Solid</button>
        <button class="flex-1 md:flex-none px-5 py-2 rounded-lg hover:text-gray-200 transition">Logos</button>
      </div>

      <!-- Search Input -->
      <div class="relative w-full md:w-96">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <input 
          type="text" 
          placeholder="Search 1500+ icons..." 
          onkeyup="filterIcons(this.value)"
          class="w-full pl-10 pr-4 py-2 bg-[#111] border border-[#222] rounded-xl text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-gray-500 transition"
        />
      </div>

      <!-- Size & Color Controls -->
      <div class="flex items-center gap-4 text-xs text-gray-400 w-full md:w-auto justify-end">
        
        <!-- Size Slider -->
        <div class="flex items-center gap-2 bg-[#111] border border-[#222] px-3 py-1.5 rounded-xl">
          <span>Size:</span>
          <input type="range" min="16" max="48" value="24" class="w-16 accent-white" oninput="updateIconSize(this.value)">
          <span id="size-indicator" class="text-white font-mono w-7">24px</span>
        </div>

        <!-- Color Circle -->
        <div class="flex items-center gap-2 bg-[#111] border border-[#222] px-3 py-1.5 rounded-xl cursor-pointer">
          <div class="w-4 h-4 rounded-full bg-white border border-gray-600"></div>
          <span class="text-gray-300">Color</span>
        </div>

      </div>

    </div>

    <!-- Boxicons Icon Grid -->
    <div id="icon-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-2.5">
      
      <!-- ICON ITEM 1 -->
      <div onclick="openModal('folder-minus', 'Files & Folders')" class="icon-card group bg-[#181818] hover:bg-[#222222] border border-[#242424] hover:border-gray-600 rounded-2xl p-4 flex flex-col items-center justify-center gap-3 transition cursor-pointer" data-name="folder minus">
        <div class="icon-wrapper text-gray-300 group-hover:text-white group-hover:scale-110 transition duration-150">
          <!-- PUT YOUR ICON SVG HERE -->
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2zm6 7h6"></path></svg>
        </div>
        <span class="text-[11px] text-gray-400 group-hover:text-gray-200 truncate w-full text-center font-medium">folder-minus</span>
      </div>

      <!-- ICON ITEM 2 -->
      <div onclick="openModal('search', 'Interface')" class="icon-card group bg-[#181818] hover:bg-[#222222] border border-[#242424] hover:border-gray-600 rounded-2xl p-4 flex flex-col items-center justify-center gap-3 transition cursor-pointer" data-name="search">
        <div class="icon-wrapper text-gray-300 group-hover:text-white group-hover:scale-110 transition duration-150">
          <!-- PUT YOUR ICON SVG HERE -->
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <span class="text-[11px] text-gray-400 group-hover:text-gray-200 truncate w-full text-center font-medium">search</span>
      </div>

      <!-- DUPLICATE ICON CARDS ABOVE FOR YOUR ICON COLLECTION -->

    </div>

  </main>

  <!-- Boxicons Detail Modal Backdrop -->
  <div id="icon-modal-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    
    <!-- Modal Container -->
    <div class="bg-[#1a1a1a] text-white rounded-3xl w-full max-w-4xl shadow-2xl relative flex flex-col font-sans border border-gray-800">
      
      <!-- Close Button -->
      <button onclick="closeModal()" class="absolute -top-3 -right-3 bg-white text-black rounded-full p-2 shadow-lg hover:bg-gray-200 transition z-50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>

      <!-- Main Modal Content -->
      <div class="flex flex-col md:flex-row p-6 gap-8">
        
        <!-- Icon Preview Canvas -->
        <div class="w-full md:w-5/12 bg-[#121212] rounded-2xl border border-gray-800 relative flex flex-col items-center justify-center min-h-[300px] bg-dots">
          <div id="modal-icon-target" class="text-white">
            <!-- Dynamically populated -->
          </div>
          <button onclick="toggleCode()" class="absolute bottom-4 left-4 bg-white/10 hover:bg-white/20 text-white text-xs py-1.5 px-3.5 rounded-full flex items-center gap-2 transition backdrop-blur-md border border-white/10">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
            <span id="code-toggle-text">View Code</span>
          </button>
        </div>

        <!-- Details & Control Actions -->
        <div class="w-full md:w-7/12 flex flex-col justify-between py-1">
          <div>
            <div class="text-gray-400 text-xs font-semibold uppercase tracking-wider mb-1" id="modal-category">
              Category
            </div>
            <h2 class="text-3xl font-bold mb-4 tracking-tight" id="modal-title">
              folder minus
            </h2>

            <div class="flex flex-wrap gap-2 mb-6">
              <span class="bg-[#2a2a2a] text-gray-300 text-xs px-3 py-1 rounded-full border border-gray-700/50">remove</span>
              <span class="bg-[#2a2a2a] text-gray-300 text-xs px-3 py-1 rounded-full border border-gray-700/50">directory</span>
              <span class="bg-[#2a2a2a] text-gray-300 text-xs px-3 py-1 rounded-full border border-gray-700/50">file</span>
            </div>
          </div>

          <!-- Downloads -->
          <div class="flex gap-3">
            <button class="flex-1 py-3 px-4 bg-white text-black font-bold text-xs rounded-xl hover:bg-gray-100 transition">
              SVG CODE
            </button>
            <button class="flex-1 py-3 px-4 bg-[#cbf33d] text-black font-bold text-xs rounded-xl hover:bg-[#bce430] transition">
              DOWNLOAD SVG
            </button>
          </div>
        </div>

      </div>

      <!-- Collapsible Code Area -->
      <div id="code-viewer" class="hidden border-t border-gray-800 bg-[#121212] rounded-b-3xl p-6">
        <code id="code-snippet" class="text-xs text-gray-300 font-mono block bg-[#1a1a1a] p-4 rounded-xl border border-gray-800">
          &lt;i class='bx bx-folder-minus'&gt;&lt;/i&gt;
        </code>
      </div>

    </div>
  </div>

  <script>
    function filterIcons(query) {
      const q = query.toLowerCase();
      const cards = document.querySelectorAll('.icon-card');
      cards.forEach(card => {
        const name = card.getAttribute('data-name');
        if (name.includes(q)) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    function updateIconSize(val) {
      document.getElementById('size-indicator').innerText = val + 'px';
      const svgs = document.querySelectorAll('.icon-wrapper svg');
      svgs.forEach(svg => {
        svg.style.width = val + 'px';
        svg.style.height = val + 'px';
      });
    }

    function openModal(name, category) {
      document.getElementById('modal-title').innerText = name.replace('-', ' ');
      document.getElementById('modal-category').innerText = category;
      
      const targetCard = event.currentTarget;
      const svgHTML = targetCard.querySelector('.icon-wrapper').innerHTML;
      document.getElementById('modal-icon-target').innerHTML = svgHTML;
      document.getElementById('code-snippet').innerText = `<i class='bx bx-${name}'></i>`;

      document.getElementById('icon-modal-backdrop').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('icon-modal-backdrop').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    function toggleCode() {
      const viewer = document.getElementById('code-viewer');
      viewer.classList.toggle('hidden');
    }
  </script>
</body>
</html>
