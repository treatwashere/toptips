<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toptips — Icon Explorer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Boxicons CSS for lightweight webfont icon rendering -->
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <style>
    body { background-color: #000000; color: #ffffff; }
    .bg-card { background-color: #0d0d0d; border: 1px solid #1a1a1a; }
    .bg-[#cbf33d] { background-color: #cbf33d; }
    .text-[#cbf33d] { color: #cbf33d; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-[#cbf33d] selection:text-black">

  <!-- Floating Navigation Header -->
  <div class="fixed top-4 inset-x-0 z-50 flex justify-center px-4 pointer-events-none">
    <header class="pointer-events-auto bg-[#111111]/90 border border-gray-800 rounded-full px-6 py-2.5 flex items-center justify-between w-full max-w-5xl backdrop-blur-md shadow-2xl">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-7 h-7 bg-white text-black font-extrabold rounded-lg flex items-center justify-center text-sm">T</div>
          <span class="font-bold text-lg tracking-tight text-white">Toptips</span>
        </a>
      </div>

      <div class="flex items-center gap-4 text-sm font-medium">
        <a href="index.html" class="text-gray-400 hover:text-white transition">Home</a>
        <a href="icons.html" class="text-[#cbf33d] font-semibold">Icons</a>
        <a href="index.html#pricing" class="text-gray-300 hover:text-white transition">Pricing</a>
      </div>
    </header>
  </div>

  <!-- Main Explorer Interface -->
  <main class="pt-28 pb-16 px-4 max-w-7xl mx-auto w-full space-y-6 flex-1">
    
    <!-- Controls Bar -->
    <div class="bg-card p-4 rounded-3xl space-y-4 border border-gray-800">
      <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
        
        <!-- Search Input -->
        <div class="relative w-full md:w-96">
          <input 
            id="icon-search" 
            type="text" 
            placeholder="Search 1,800+ icons..." 
            oninput="handleSearch(this.value)"
            class="w-full bg-[#141414] border border-gray-800 rounded-2xl py-2.5 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-[#cbf33d]"
          />
          <svg class="w-4 h-4 absolute left-3.5 top-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>

        <!-- Library Filter Tabs -->
        <div class="flex bg-[#121212] p-1 rounded-2xl border border-gray-800 text-xs font-semibold">
          <button id="tab-all" onclick="setLibrary('all')" class="px-4 py-2 rounded-xl bg-white text-black transition">All</button>
          <button id="tab-boxicons" onclick="setLibrary('boxicons')" class="px-4 py-2 rounded-xl text-gray-400 hover:text-white transition">Boxicons</button>
          <button id="tab-heroicons" onclick="setLibrary('heroicons')" class="px-4 py-2 rounded-xl text-gray-400 hover:text-white transition">Heroicons</button>
        </div>

        <!-- Dynamic Size & Style Options -->
        <div class="flex items-center gap-4 text-xs text-gray-400">
          <div class="flex items-center gap-2">
            <span>Size:</span>
            <input type="range" min="16" max="48" value="28" id="size-slider" oninput="updateSize(this.value)" class="w-20 accent-[#cbf33d]">
            <span id="size-val" class="font-mono text-white">28px</span>
          </div>
          <div class="flex items-center gap-2">
            <span>Color:</span>
            <input type="color" id="color-picker" value="#ffffff" onchange="updateColor(this.value)" class="w-6 h-6 rounded-full bg-transparent border-0 cursor-pointer">
          </div>
        </div>

      </div>
    </div>

    <!-- Active Count Display -->
    <div class="flex justify-between items-center px-2 text-xs text-gray-400">
      <span id="icon-count">Loading icon library...</span>
      <span class="text-gray-500">Click any icon to customize & copy</span>
    </div>

    <!-- Main Grid Display -->
    <div id="icon-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-3">
      <!-- Icons render here dynamically -->
    </div>

  </main>

  <!-- Interactive Drawer/Modal -->
  <div id="icon-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#121212] border border-gray-800 rounded-3xl max-w-lg w-full p-6 relative space-y-6 text-left shadow-2xl">
      <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-800 text-gray-300 hover:text-white rounded-full p-2 text-xs">✕</button>
      
      <div>
        <span id="modal-library-badge" class="text-[10px] uppercase font-bold tracking-wider bg-[#cbf33d] text-black px-2.5 py-0.5 rounded-full">Boxicons</span>
        <h3 id="modal-title" class="text-2xl font-bold capitalize mt-2">Icon Name</h3>
      </div>

      <!-- Live Preview Container -->
      <div class="bg-[#0a0a0a] border border-gray-800 rounded-2xl p-10 flex items-center justify-center min-h-[160px]" id="modal-preview-box">
        <!-- SVG dynamically injected -->
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3">
        <button onclick="copyIconCode()" class="flex-1 bg-white text-black py-2.5 rounded-xl font-bold text-xs hover:bg-gray-200 transition">Copy SVG / Class Code</button>
        <button onclick="downloadIcon()" class="flex-1 bg-[#cbf33d] text-black py-2.5 rounded-xl font-bold text-xs hover:bg-[#bce430] transition">Download Icon</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Icon Fetching & Filtering Engine -->
  <script>
    let activeLibrary = 'all';
    let currentSize = '28px';
    let currentColor = '#ffffff';
    let activeIconData = null;
    let allIcons = [];

    // Common Heroicons keylist for dynamic SVG loading
    const heroiconsNames = [
      "academic-cap", "adjustments-horizontal", "adjustments-vertical", "archive-box", "arrow-down", "arrow-left", "arrow-right", "arrow-up",
      "arrow-path", "bars-3", "bell", "bookmark", "building-office", "calculator", "calendar", "camera", "chart-bar", "check", "chevron-down",
      "chevron-left", "chevron-right", "chevron-up", "clock", "cog-6-tooth", "credit-card", "document", "envelope", "eye", "film", "folder",
      "globe-alt", "heart", "home", "inbox", "key", "light-bulb", "link", "lock-closed", "magnifying-glass", "map-pin", "user", "star", "trash"
    ];

    // Popular Boxicons keylist
    const boxiconsNames = [
      "bx-home", "bx-user", "bx-search", "bx-cog", "bx-bell", "bx-envelope", "bx-[#cbf33d]", "bx-heart", "bx-star", "bx-check", "bx-x",
      "bx-plus", "bx-minus", "bx-info-circle", "bx-trash", "bx-edit", "bx-share-alt", "bx-download", "bx-upload", "bx-folder", "bx-file",
      "bx-camera", "bx-image", "bx-music", "bx-video", "bx-phone", "bx-map", "bx-calendar", "bx-time", "bx-lock", "bx-key", "bx-[#cbf33d]",
      "bxl-github", "bxl-twitter", "bxl-facebook", "bxl-instagram", "bxl-discord", "bxl-tailwind-css", "bxl-[#cbf33d]", "bxl-figma"
    ];

    function initIcons() {
      allIcons = [];
      
      // Load Boxicons set
      boxiconsNames.forEach(name => {
        allIcons.push({ name: name.replace('bx-', '').replace('bxl-', ''), type: 'boxicons', code: name });
      });

      // Load Heroicons set
      heroiconsNames.forEach(name => {
        allIcons.push({ name: name, type: 'heroicons', code: name });
      });

      renderIcons(allIcons);
    }

    function renderIcons(icons) {
      const grid = document.getElementById('icon-grid');
      grid.innerHTML = '';

      icons.forEach(icon => {
        const card = document.createElement('div');
        card.className = "bg-card hover:bg-[#141414] border border-gray-800 hover:border-[#cbf33d]/50 p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition group";
        card.onclick = () => openModal(icon);

        let iconContent = '';
        if (icon.type === 'boxicons') {
          iconContent = `<i class='bx ${icon.code}' style='font-size: ${currentSize}; color: ${currentColor};'></i>`;
        } else {
          // Dynamic Heroicon SVG rendering via Unpkg CDN
          iconContent = `<img src="https://unpkg.com/heroicons@2.0.18/24/outline/${icon.code}.svg" style="width: ${currentSize}; height: ${currentSize}; filter: invert(1);" alt="${icon.name}" class="group-hover:scale-110 transition"/>`;
        }

        card.innerHTML = `
          <div class="icon-wrapper flex items-center justify-center h-10 w-10 mb-2">
            ${iconContent}
          </div>
          <span class="text-[10px] text-gray-400 group-hover:text-white truncate w-full text-center">${icon.name}</span>
        `;
        grid.appendChild(card);
      });

      document.getElementById('icon-count').innerText = `Showing ${icons.length} icons`;
    }

    function handleSearch(query) {
      const q = query.toLowerCase();
      const filtered = allIcons.filter(icon => {
        const matchesLib = activeLibrary === 'all' || icon.type === activeLibrary;
        const matchesQuery = icon.name.includes(q);
        return matchesLib && matchesQuery;
      });
      renderIcons(filtered);
    }

    function setLibrary(lib) {
      activeLibrary = lib;
      ['all', 'boxicons', 'heroicons'].forEach(l => {
        const btn = document.getElementById(`tab-${l}`);
        if (l === lib) {
          btn.className = "px-4 py-2 rounded-xl bg-white text-black transition font-bold";
        } else {
          btn.className = "px-4 py-2 rounded-xl text-gray-400 hover:text-white transition";
        }
      });
      handleSearch(document.getElementById('icon-search').value);
    }

    function updateSize(val) {
      currentSize = val + 'px';
      document.getElementById('size-val').innerText = currentSize;
      handleSearch(document.getElementById('icon-search').value);
    }

    function updateColor(val) {
      currentColor = val;
      handleSearch(document.getElementById('icon-search').value);
    }

    function openModal(icon) {
      activeIconData = icon;
      document.getElementById('modal-title').innerText = icon.name;
      document.getElementById('modal-library-badge').innerText = icon.type;
      
      const previewBox = document.getElementById('modal-preview-box');
      if (icon.type === 'boxicons') {
        previewBox.innerHTML = `<i class='bx ${icon.code}' style='font-size: 64px; color: ${currentColor};'></i>`;
      } else {
        previewBox.innerHTML = `<img src="https://unpkg.com/heroicons@2.0.18/24/outline/${icon.code}.svg" style="width: 64px; height: 64px; filter: invert(1);" />`;
      }

      document.getElementById('icon-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('icon-modal').classList.add('hidden');
    }

    function copyIconCode() {
      if (!activeIconData) return;
      let textToCopy = '';
      if (activeIconData.type === 'boxicons') {
        textToCopy = `<i class='bx ${activeIconData.code}'></i>`;
      } else {
        textToCopy = `<img src="https://unpkg.com/heroicons@2.0.18/24/outline/${activeIconData.code}.svg" alt="${activeIconData.name}" />`;
      }
      navigator.clipboard.writeText(textToCopy);
      alert('Icon snippet copied to clipboard!');
    }

    function downloadIcon() {
      alert('Downloading icon asset...');
    }

    // Initialize library on page load
    window.onload = initIcons;
  </script>
</body>
</html>
