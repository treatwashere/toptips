<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toptips — Icon Explorer</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Boxicons CSS CDN (Required to render the Boxicon font classes) -->
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  
  <style>
    body { background-color: #000000; color: #ffffff; }
    .bg-card { background-color: #0d0d0d; border: 1px solid #1a1a1a; }
    .bg-sidebar { background-color: #080808; border: 1px solid #181818; }
    .accent-lime { background-color: #cbf33d; color: #000000; }
    
    /* Custom Scrollbar for the grid */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-[#cbf33d] selection:text-black">

  <!-- Floating Header Navigation -->
  <div class="fixed top-4 inset-x-0 z-40 flex justify-center px-4 pointer-events-none">
    <header class="pointer-events-auto bg-[#111111]/90 border border-gray-800 rounded-full px-6 py-2.5 flex items-center justify-between w-full max-w-6xl backdrop-blur-md shadow-2xl">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-7 h-7 bg-white text-black font-extrabold rounded-lg flex items-center justify-center text-sm">T</div>
          <span class="font-bold text-lg tracking-tight text-white">Toptips</span>
        </a>
      </div>

      <div class="flex items-center gap-6 text-sm font-medium">
        <a href="index.html" class="text-gray-400 hover:text-white transition">Home</a>
        <a href="icons.html" class="text-[#cbf33d] font-semibold">Icons</a>
        <a href="index.html#pricing" class="text-gray-400 hover:text-white transition">Pricing</a>
      </div>
    </header>
  </div>

  <!-- Main Explorer Section -->
  <main class="pt-24 pb-16 px-6 max-w-7xl mx-auto w-full flex-1 space-y-6">
    
    <!-- Top Search & Style Controls -->
    <div class="flex flex-col items-center gap-4 max-w-2xl mx-auto">
      <div class="relative w-full">
        <input 
          id="icon-search" 
          type="text" 
          placeholder="Search 1,800+ Icons" 
          oninput="handleSearch(this.value)"
          class="w-full bg-[#0d0d0d] border border-gray-800 rounded-2xl py-3 pl-11 pr-12 text-sm text-white focus:outline-none focus:border-[#cbf33d]"
        />
        <svg class="w-4 h-4 absolute left-4 top-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <kbd class="absolute right-4 top-3 px-2 py-0.5 text-xs text-gray-500 bg-gray-800 rounded-lg">⌘K</kbd>
      </div>

      <!-- Icon Style Switchers -->
      <div class="flex bg-[#111111] p-1 rounded-full border border-gray-800 text-xs font-medium">
        <button id="style-regular" onclick="setStyle('regular')" class="px-5 py-1.5 rounded-full bg-white text-black font-bold transition">Regular</button>
        <button id="style-rounded" onclick="setStyle('rounded')" class="px-5 py-1.5 rounded-full text-gray-400 hover:text-white transition">Rounded</button>
        <button id="style-sharp" onclick="setStyle('sharp')" class="px-5 py-1.5 rounded-full text-gray-400 hover:text-white transition">Sharp</button>
      </div>
    </div>

    <!-- Sidebar + Main Grid -->
    <div class="grid grid-cols-1 md:grid-cols-5 gap-6 pt-4">
      
      <!-- Left Sidebar Filters -->
      <div class="md:col-span-1 space-y-6">
        
        <!-- Category Filters -->
        <div class="bg-sidebar p-4 rounded-3xl space-y-2">
          <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider px-2">Categories</span>
          <div class="space-y-1 pt-1 text-xs">
            <button id="cat-all" onclick="setCategory('all')" class="w-full text-left px-3 py-2 rounded-xl accent-lime font-bold flex justify-between items-center">
              <span>All Icons</span>
              <span id="total-count-badge" class="text-[10px] bg-black/20 px-2 py-0.5 rounded-full">Loading...</span>
            </button>
            <button id="cat-sports" onclick="setCategory('sports')" class="w-full text-left px-3 py-2 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">Sports & Games</button>
            <button id="cat-files" onclick="setCategory('files')" class="w-full text-left px-3 py-2 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">Files & Folders</button>
            <button id="cat-interface" onclick="setCategory('interface')" class="w-full text-left px-3 py-2 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">Interface</button>
            <button id="cat-logos" onclick="setCategory('logos')" class="w-full text-left px-3 py-2 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">Logos & Brands</button>
          </div>
        </div>

        <!-- Library Source Toggles -->
        <div class="bg-sidebar p-4 rounded-3xl space-y-3">
          <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider px-2">Library Source</span>
          <div class="space-y-2 text-xs">
            <label class="flex items-center gap-2 cursor-pointer text-gray-300">
              <input type="radio" name="lib" value="all" checked onchange="setLibrary('all')" class="accent-[#cbf33d]">
              <span>All Libraries</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-gray-300">
              <input type="radio" name="lib" value="boxicons" onchange="setLibrary('boxicons')" class="accent-[#cbf33d]">
              <span>Boxicons</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-gray-300">
              <input type="radio" name="lib" value="heroicons" onchange="setLibrary('heroicons')" class="accent-[#cbf33d]">
              <span>Heroicons</span>
            </label>
          </div>
        </div>

      </div>

      <!-- Icon Display Grid -->
      <div class="md:col-span-4">
        <!-- Status indicator for loading large sets -->
        <div id="loading-status" class="text-center text-sm text-gray-500 py-10">Fetching all 1,800+ icons from CDNs...</div>
        
        <div id="icon-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 hidden">
          <!-- Populated dynamically by CDNs -->
        </div>
      </div>

    </div>
  </main>

  <!-- Icon Inspector Modal Drawer -->
  <div id="icon-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#0d0d0d] border border-gray-800 rounded-3xl max-w-2xl w-full p-8 relative space-y-6 text-left shadow-2xl">
      <button onclick="closeModal()" class="absolute top-6 right-6 text-gray-400 hover:text-white text-sm">✕</button>
      
      <div class="grid md:grid-cols-2 gap-6 items-center">
        <!-- Live Preview Box -->
        <div class="bg-[#050505] border border-gray-800 rounded-2xl h-64 flex flex-col items-center justify-center relative p-6">
          <div id="modal-preview-icon" class="flex items-center justify-center text-6xl text-[#cbf33d]"></div>
          <button onclick="copyIconCode()" class="absolute bottom-4 left-4 bg-white/10 text-white text-xs px-3 py-1.5 rounded-full backdrop-blur-md border border-white/10 hover:bg-white/20 transition">
            &lt;/&gt; View Code
          </button>
        </div>

        <!-- Customizer Panel -->
        <div class="space-y-4">
          <div>
            <span id="modal-category" class="text-[10px] font-bold text-gray-500 uppercase tracking-wider" id="modal-cat-display">LOGOS</span>
            <h3 id="modal-title" class="text-2xl font-bold capitalize mt-1">Icon Name</h3>
          </div>

          <!-- Color Chooser -->
          <div class="space-y-1.5">
            <span class="text-xs text-gray-400">Colors</span>
            <div class="flex gap-2">
              <button onclick="setModalColor('#cbf33d')" class="w-6 h-6 rounded-full bg-[#cbf33d] ring-2 ring-white/20"></button>
              <button onclick="setModalColor('#a855f7')" class="w-6 h-6 rounded-full bg-purple-500"></button>
              <button onclick="setModalColor('#ffffff')" class="w-6 h-6 rounded-full bg-white"></button>
              <button onclick="setModalColor('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500"></button>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs text-gray-400 pt-2">
            <span>Size</span>
            <span class="font-mono text-white">24 px</span>
          </div>

          <!-- Export Buttons -->
          <div class="space-y-2 pt-2">
            <button onclick="copyIconCode()" class="w-full bg-white text-black py-2.5 rounded-xl font-bold text-xs hover:bg-gray-200 transition">SVG / CLASS CODE</button>
            <button onclick="downloadIcon()" class="w-full bg-[#cbf33d] text-black py-2.5 rounded-xl font-bold text-xs hover:bg-[#bce430] transition">Download SVG</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // COMPLETE CDN SOURCES
    // ==========================================
    const BOXICONS_JSON_CDN = "https://unpkg.com/boxicons@2.1.4/json/boxicons.json";
    // We use unpkg's ?meta flag to read the directory of the package and grab EVERY single SVG dynamically.
    const HEROICONS_META_CDN = "https://unpkg.com/heroicons@2.0.18/24/outline/?meta";
    const HEROICONS_BASE_URL = "https://unpkg.com/heroicons@2.0.18/24/outline/";
    // ==========================================

    let allIcons = [];
    let currentCategory = 'all';
    let currentLibrary = 'all';
    let activeModalIcon = null;
    let selectedColor = '#cbf33d';

    async function loadEverySingleIcon() {
      try {
        const [boxRes, heroRes] = await Promise.all([
          fetch(BOXICONS_JSON_CDN),
          fetch(HEROICONS_META_CDN)
        ]);

        const boxData = await boxRes.json();
        const heroMeta = await heroRes.json();

        // 1. Parse EVERY Boxicon (approx 1,500+)
        boxData.forEach(item => {
          let prefix = item.name.startsWith('logo-') ? 'bxl' : 'bx';
          let cleanName = item.name.replace('logo-', '');
          
          allIcons.push({
            name: cleanName,
            lib: 'boxicons',
            cat: categorizeBoxicon(cleanName, item.category),
            code: `${prefix} bx-${cleanName}`
          });
        });

        // 2. Parse EVERY Heroicon (approx 290+)
        // The ?meta endpoint returns a JSON tree where .files contains the directory contents.
        if (heroMeta && heroMeta.files) {
          heroMeta.files.forEach(fileObj => {
            if (fileObj.path.endsWith('.svg')) {
              let iconName = fileObj.path.replace('.svg', '').replace('/', '');
              allIcons.push({
                name: iconName,
                lib: 'heroicons',
                cat: categorizeHeroicon(iconName),
                cdnUrl: `${HEROICONS_BASE_URL}${iconName}.svg`
              });
            }
          });
        }

        // Remove loading state and show grid
        document.getElementById('loading-status').classList.add('hidden');
        document.getElementById('icon-grid').classList.remove('hidden');
        document.getElementById('total-count-badge').innerText = `${allIcons.length}`;
        
        filterAndRender();

      } catch (error) {
        document.getElementById('loading-status').innerText = "Error loading icons from CDNs. Please check your connection.";
        console.error("CDN Fetch Error:", error);
      }
    }

    // Helper functions to categorize icons to match the sidebar filters
    function categorizeBoxicon(name, originalCategory) {
      const n = name.toLowerCase();
      if (originalCategory === 'logo') return 'logos';
      if (n.includes('ball') || n.includes('sport') || n.includes('game')) return 'sports';
      if (n.includes('folder') || n.includes('file') || n.includes('doc')) return 'files';
      return 'interface';
    }

    function categorizeHeroicon(name) {
      const n = name.toLowerCase();
      if (n.includes('folder') || n.includes('document') || n.includes('archive')) return 'files';
      if (n.includes('trophy') || n.includes('play')) return 'sports';
      return 'interface';
    }

    // Rendering Engine
    function filterAndRender() {
      const q = document.getElementById('icon-search').value.toLowerCase();
      
      const filtered = allIcons.filter(icon => {
        const matchesCat = currentCategory === 'all' || icon.cat === currentCategory;
        const matchesLib = currentLibrary === 'all' || icon.lib === currentLibrary;
        const matchesSearch = icon.name.toLowerCase().includes(q);
        return matchesCat && matchesLib && matchesSearch;
      });

      const grid = document.getElementById('icon-grid');
      grid.innerHTML = '';

      // Limit initial render to 300 to prevent browser freezing if they search "all"
      // User can type to filter down further
      const iconsToRender = filtered.slice(0, 300); 

      iconsToRender.forEach(icon => {
        const item = document.createElement('div');
        item.className = "bg-[#0a0a0a] hover:bg-[#141414] border border-gray-800 hover:border-gray-600 p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition text-center group min-h-[90px]";
        item.onclick = () => openModal(icon);

        let iconMarkup = '';
        if (icon.lib === 'boxicons') {
          iconMarkup = `<i class='${icon.code} text-3xl group-hover:scale-110 transition text-gray-300 group-hover:text-white'></i>`;
        } else {
          // Applying CSS filter to invert SVG colors to white for dark mode
          iconMarkup = `<img src="${icon.cdnUrl}" class="w-7 h-7 filter invert opacity-80 group-hover:opacity-100 group-hover:scale-110 transition" alt="${icon.name}"/>`;
        }

        item.innerHTML = `
          <div class="mb-3 flex items-center justify-center">${iconMarkup}</div>
          <span class="text-[10px] text-gray-500 group-hover:text-gray-300 truncate w-full px-1">${icon.name.replace(/-/g, ' ')}</span>
        `;
        grid.appendChild(item);
      });
    }

    // UI Event Handlers
    function handleSearch() { filterAndRender(); }

    function setCategory(cat) {
      currentCategory = cat;
      ['all', 'sports', 'files', 'interface', 'logos'].forEach(c => {
        const btn = document.getElementById(`cat-${c}`);
        if (c === cat) {
          btn.className = "w-full text-left px-3 py-2 rounded-xl accent-lime font-bold flex justify-between items-center";
        } else {
          btn.className = "w-full text-left px-3 py-2 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition";
        }
      });
      filterAndRender();
    }

    function setLibrary(lib) {
      currentLibrary = lib;
      filterAndRender();
    }

    function setStyle(style) {
      ['regular', 'rounded', 'sharp'].forEach(s => {
        const btn = document.getElementById(`style-${s}`);
        if (s === style) {
          btn.className = "px-5 py-1.5 rounded-full bg-white text-black font-bold transition";
        } else {
          btn.className = "px-5 py-1.5 rounded-full text-gray-400 hover:text-white transition";
        }
      });
    }

    // Modal Handlers
    function openModal(icon) {
      activeModalIcon = icon;
      document.getElementById('modal-title').innerText = icon.name.replace(/-/g, ' ');
      document.getElementById('modal-cat-display').innerText = icon.cat;

      const container = document.getElementById('modal-preview-icon');
      
      if (icon.lib === 'boxicons') {
        container.innerHTML = `<i class='${icon.code}' style="color: ${selectedColor}"></i>`;
      } else {
        // We use a CSS trick to colorize black SVGs fetched from CDN
        // Since we can't easily inject arbitrary hex colors into an <img> tag src, 
        // we use a mask if needed, but for simplicity here we just use invert for white, and leave default logic.
        let filterStyle = selectedColor === '#ffffff' ? 'filter: invert(1);' : `filter: drop-shadow(0 0 0 ${selectedColor});`;
        container.innerHTML = `<img src="${icon.cdnUrl}" style="width: 72px; height: 72px; ${filterStyle}"/>`;
      }

      document.getElementById('icon-modal').classList.remove('hidden');
    }

    function setModalColor(hex) {
      selectedColor = hex;
      if (activeModalIcon) openModal(activeModalIcon);
    }

    function closeModal() {
      document.getElementById('icon-modal').classList.add('hidden');
    }

    function copyIconCode() {
      if (!activeModalIcon) return;
      const snippet = activeModalIcon.lib === 'boxicons' 
        ? `<i class='${activeModalIcon.code}'></i>`
        : `<img src="${activeModalIcon.cdnUrl}" alt="${activeModalIcon.name}" />`;
      navigator.clipboard.writeText(snippet);
      alert('Icon snippet copied to clipboard!');
    }

    function downloadIcon() { 
      if (!activeModalIcon) return;
      alert(`Preparing SVG download for ${activeModalIcon.name}...`);
    }

    // Initialize the fetch when page loads
    window.onload = loadEverySingleIcon;
  </script>
</body>
</html>
