<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toptips — Icon Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <style>
    body { background-color: #000000; color: #ffffff; }
    .bg-card { background-color: #0d0d0d; border: 1px solid #1a1a1a; }
    .bg-[#cbf33d] { background-color: #cbf33d; }
    .text-[#cbf33d] { color: #cbf33d; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-[#cbf33d] selection:text-black">

  <!-- Floating Navigation Header -->
  <div class="fixed top-4 inset-x-0 z-40 flex justify-center px-4 pointer-events-none">
    <header class="pointer-events-auto bg-[#111111]/90 border border-gray-800 rounded-full px-6 py-2.5 flex items-center justify-between w-full max-w-6xl backdrop-blur-md shadow-2xl">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-7 h-7 bg-white text-black font-extrabold rounded-lg flex items-center justify-center text-sm">T</div>
          <span class="font-bold text-lg tracking-tight text-white">Toptips</span>
        </a>
      </div>

      <div class="flex items-center gap-4 text-sm font-medium">
        <a href="index.html" class="text-gray-400 hover:text-white transition">Home</a>
        <a href="icons.html" class="text-[#cbf33d] font-semibold">Icons</a>
        <a href="index.html#pricing" class="text-gray-300 hover:text-white transition">Pricing</a>
      </div>
    </header>
  </div>

  <!-- Search & Style Toolbar Container -->
  <section class="pt-28 pb-4 px-4 max-w-7xl mx-auto w-full space-y-4">
    <div class="max-w-xl mx-auto relative">
      <input 
        id="icon-search" 
        type="text" 
        placeholder="Search 50k+ Icons" 
        oninput="handleSearch(this.value)"
        class="w-full bg-[#111111] border border-gray-800 rounded-2xl py-3 pl-10 pr-12 text-sm text-white focus:outline-none focus:border-[#cbf33d]"
      />
      <svg class="w-4 h-4 absolute left-3.5 top-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <kbd class="absolute right-3.5 top-3 px-2 py-0.5 text-[10px] text-gray-400 bg-gray-800 rounded-lg">⌘K</kbd>
    </div>

    <!-- Style Selector Toolbar -->
    <div class="flex justify-center items-center gap-6 text-xs text-gray-400 font-medium">
      <button onclick="setStyle('regular')" id="style-regular" class="hover:text-white transition">Regular</button>
      <button onclick="setStyle('rounded')" id="style-rounded" class="bg-white text-black px-3 py-1 rounded-full font-bold transition">Rounded</button>
      <button onclick="setStyle('sharp')" id="style-sharp" class="hover:text-white transition">Sharp</button>
    </div>
  </section>

  <!-- Sidebar & Grid Layout -->
  <div class="max-w-7xl w-full mx-auto px-4 py-4 flex-1 flex flex-col md:flex-row gap-6">
    
    <!-- Sidebar Categories -->
    <aside class="w-full md:w-56 flex-shrink-0 space-y-4">
      <div class="bg-card p-4 rounded-3xl space-y-2">
        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3 px-2">Categories</h3>
        <nav class="space-y-1 text-xs font-medium">
          <button onclick="filterCategory('all')" class="cat-btn w-full flex items-center justify-between px-3 py-2 rounded-xl bg-[#cbf33d] text-black font-semibold">
            <span>All Icons</span>
            <span class="text-[10px] opacity-70">1800+</span>
          </button>
          <button onclick="filterCategory('sports')" class="cat-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/50 transition">
            <span>Sports & Games</span>
          </button>
          <button onclick="filterCategory('files')" class="cat-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/50 transition">
            <span>Files & Folders</span>
          </button>
          <button onclick="filterCategory('interface')" class="cat-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/50 transition">
            <span>Interface</span>
          </button>
          <button onclick="filterCategory('logos')" class="cat-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/50 transition">
            <span>Logos & Brands</span>
          </button>
        </nav>
      </div>

      <!-- Icon Library Source Selector -->
      <div class="bg-card p-4 rounded-3xl space-y-2">
        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2 px-2">Library Source</h3>
        <div class="space-y-1 text-xs">
          <label class="flex items-center gap-2 px-2 py-1 cursor-pointer text-gray-300">
            <input type="radio" name="lib" value="all" checked onclick="setLibrary('all')" class="accent-[#cbf33d]"> All Libraries
          </label>
          <label class="flex items-center gap-2 px-2 py-1 cursor-pointer text-gray-300">
            <input type="radio" name="lib" value="boxicons" onclick="setLibrary('boxicons')" class="accent-[#cbf33d]"> Boxicons
          </label>
          <label class="flex items-center gap-2 px-2 py-1 cursor-pointer text-gray-300">
            <input type="radio" name="lib" value="heroicons" onclick="setLibrary('heroicons')" class="accent-[#cbf33d]"> Heroicons
          </label>
        </div>
      </div>
    </aside>

    <!-- Main Grid Container -->
    <main class="flex-1">
      <div id="icon-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3">
        <!-- Icons rendered dynamically -->
      </div>
    </main>

  </div>

  <!-- RESTORED FULL BOXICONS DRAWER / MODAL -->
  <div id="icon-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#121212] border border-gray-800 rounded-3xl max-w-3xl w-full p-6 relative flex flex-col md:flex-row gap-6 text-left shadow-2xl">
      
      <!-- Close Button -->
      <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white rounded-full p-2 text-xs z-10">✕</button>

      <!-- Left Side: Custom Dot Grid Preview -->
      <div class="w-full md:w-1/2 bg-[#0a0a0a] border border-gray-800/80 rounded-2xl flex flex-col items-center justify-center min-h-[260px] relative p-6">
        <div id="drawer-preview-target" class="flex items-center justify-center">
          <!-- Live Icon Injected Here -->
        </div>

        <button onclick="toggleCodeView()" class="absolute bottom-4 left-4 bg-white/10 hover:bg-white/20 text-white text-xs px-3 py-1.5 rounded-full backdrop-blur-md border border-white/10 flex items-center gap-1.5 transition">
          <i class='bx bx-code-alt'></i>
          <span id="code-btn-text">View Code</span>
        </button>
      </div>

      <!-- Right Side: Customization Controls -->
      <div class="w-full md:w-1/2 flex flex-col justify-between space-y-4">
        
        <div class="space-y-3">
          <div class="flex justify-between items-center text-[10px] text-gray-500 font-semibold uppercase tracking-wider">
            <span id="drawer-category">Sports & Games</span>
            <button class="text-gray-400 hover:text-white flex items-center gap-1"><i class='bx bx-info-circle'></i> Usage</button>
          </div>

          <h2 id="drawer-title" class="text-2xl font-bold capitalize">golf ball</h2>

          <!-- Category Tags -->
          <div class="flex flex-wrap gap-1.5 text-[10px] text-gray-400">
            <span class="bg-[#1c1c1c] px-2.5 py-1 rounded-full border border-gray-800">sport</span>
            <span class="bg-[#1c1c1c] px-2.5 py-1 rounded-full border border-gray-800">game</span>
            <span class="bg-[#1c1c1c] px-2.5 py-1 rounded-full border border-gray-800">course</span>
            <span class="bg-[#1c1c1c] px-2.5 py-1 rounded-full border border-gray-800">activity</span>
          </div>

          <!-- Color Switches -->
          <div class="flex items-center gap-3 text-xs pt-2">
            <span class="text-gray-400 w-12">Colors</span>
            <div class="flex gap-2 items-center">
              <button onclick="setDrawerColor('#cbf33d')" class="w-5 h-5 rounded-full bg-[#cbf33d] ring-2 ring-white/20"></button>
              <button onclick="setDrawerColor('#a855f7')" class="w-5 h-5 rounded-full bg-purple-500"></button>
              <button onclick="setDrawerColor('#ffffff')" class="w-5 h-5 rounded-full bg-white"></button>
              <input type="color" onchange="setDrawerColor(this.value)" class="w-5 h-5 rounded-full bg-transparent border-0 cursor-pointer">
            </div>
          </div>

          <!-- Padding Toggle & Transforms -->
          <div class="flex items-center justify-between text-xs text-gray-400 pt-1">
            <div class="flex items-center gap-2">
              <span>Padding</span>
              <button class="w-7 h-7 bg-[#1c1c1c] border border-gray-800 rounded-lg flex items-center justify-center text-white"><i class='bx bx-checkbox'></i></button>
            </div>
            <div class="flex items-center gap-2">
              <span>Flip</span>
              <button class="w-7 h-7 bg-[#1c1c1c] border border-gray-800 rounded-lg flex items-center justify-center text-white"><i class='bx bx-reflect-vertical'></i></button>
              <button class="w-7 h-7 bg-[#1c1c1c] border border-gray-800 rounded-lg flex items-center justify-center text-white"><i class='bx bx-reflect-horizontal'></i></button>
            </div>
            <div class="flex items-center gap-2">
              <span>Rotate</span>
              <button class="w-7 h-7 bg-[#1c1c1c] border border-gray-800 rounded-lg flex items-center justify-center text-white"><i class='bx bx-rotate-right'></i></button>
            </div>
          </div>

          <!-- Size Control Slider -->
          <div class="flex items-center gap-3 text-xs pt-1">
            <button class="w-6 h-6 bg-[#1c1c1c] rounded flex items-center justify-center">-</button>
            <span class="font-mono text-white text-xs">24 px</span>
            <button class="w-6 h-6 bg-[#1c1c1c] rounded flex items-center justify-center">+</button>
            <div class="flex-1 bg-[#1c1c1c] border border-gray-800 py-1 px-3 rounded-lg flex justify-between items-center text-gray-400">
              <span>⚡ No Animation</span>
              <i class='bx bx-chevron-down'></i>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-2 pt-2">
          <button onclick="copyCodeSnippet()" class="flex-1 bg-white text-black py-2.5 rounded-xl font-bold text-xs hover:bg-gray-200 transition flex items-center justify-center gap-1">
            <i class='bx bx-copy'></i> SVG CODE
          </button>
          <button class="flex-1 bg-[#cbf33d] text-black py-2.5 rounded-xl font-bold text-xs hover:bg-[#bce430] transition flex items-center justify-center gap-1">
            <i class='bx bx-download'></i> SVG
          </button>
        </div>

      </div>

    </div>
  </div>

  <script>
    let activeLibrary = 'all';
    let currentCategory = 'all';
    let activeIcon = null;
    let drawerColor = '#cbf33d';

    const sampleIcons = [
      { name: 'golf ball', category: 'sports', type: 'boxicons', code: 'bx-tennis-ball' },
      { name: 'basketball', category: 'sports', type: 'boxicons', code: 'bx-basketball' },
      { name: 'football', category: 'sports', type: 'boxicons', code: 'bx-football' },
      { name: 'folder minus', category: 'files', type: 'boxicons', code: 'bx-folder-minus' },
      { name: 'folder plus', category: 'files', type: 'boxicons', code: 'bx-folder-plus' },
      { name: 'file', category: 'files', type: 'boxicons', code: 'bx-file' },
      { name: 'search', category: 'interface', type: 'boxicons', code: 'bx-search' },
      { name: 'cog', category: 'interface', type: 'boxicons', code: 'bx-cog' },
      { name: 'bell', category: 'interface', type: 'boxicons', code: 'bx-bell' },
      { name: 'github', category: 'logos', type: 'boxicons', code: 'bxl-github' },
      { name: 'tailwind', category: 'logos', type: 'boxicons', code: 'bxl-tailwind-css' },
      { name: 'academic cap', category: 'interface', type: 'heroicons', code: 'academic-cap' },
      { name: 'camera', category: 'interface', type: 'heroicons', code: 'camera' },
      { name: 'heart', category: 'interface', type: 'heroicons', code: 'heart' }
    ];

    function renderGrid() {
      const grid = document.getElementById('icon-grid');
      grid.innerHTML = '';

      const query = document.getElementById('icon-search').value.toLowerCase();

      const filtered = sampleIcons.filter(icon => {
        const matchLib = activeLibrary === 'all' || icon.type === activeLibrary;
        const matchCat = currentCategory === 'all' || icon.category === currentCategory;
        const matchSearch = icon.name.includes(query);
        return matchLib && matchCat && matchSearch;
      });

      filtered.forEach(icon => {
        const card = document.createElement('div');
        card.className = "bg-card hover:bg-[#141414] border border-gray-800 hover:border-[#cbf33d]/50 p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition group";
        card.onclick = () => openDrawer(icon);

        let iconMarkup = '';
        if (icon.type === 'boxicons') {
          iconMarkup = `<i class='bx ${icon.code} text-2xl text-gray-300 group-hover:text-[#cbf33d] transition'></i>`;
        } else {
          iconMarkup = `<img src="https://unpkg.com/heroicons@2.0.18/24/outline/${icon.code}.svg" class="w-6 h-6 filter invert group-hover:scale-110 transition"/>`;
        }

        card.innerHTML = `
          <div class="mb-2 flex items-center justify-center h-8">${iconMarkup}</div>
          <span class="text-[10px] text-gray-400 group-hover:text-white truncate w-full text-center">${icon.name}</span>
        `;
        grid.appendChild(card);
      });
    }

    function openDrawer(icon) {
      activeIcon = icon;
      document.getElementById('drawer-title').innerText = icon.name;
      document.getElementById('drawer-category').innerText = icon.category;
      
      updateDrawerPreview();
      document.getElementById('icon-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('icon-modal').classList.add('hidden');
    }

    function setDrawerColor(color) {
      drawerColor = color;
      updateDrawerPreview();
    }

    function updateDrawerPreview() {
      const target = document.getElementById('drawer-preview-target');
      if (activeIcon.type === 'boxicons') {
        target.innerHTML = `<i class='bx ${activeIcon.code}' style='font-size: 80px; color: ${drawerColor};'></i>`;
      } else {
        target.innerHTML = `<img src="https://unpkg.com/heroicons@2.0.18/24/outline/${activeIcon.code}.svg" style="width: 80px; height: 80px; filter: invert(1);" />`;
      }
    }

    function handleSearch() { renderGrid(); }
    function setLibrary(lib) { activeLibrary = lib; renderGrid(); }
    function filterCategory(cat) { currentCategory = cat; renderGrid(); }
    function setStyle(st) {
      ['regular', 'rounded', 'sharp'].forEach(s => {
        const btn = document.getElementById(`style-${s}`);
        btn.className = s === st ? "bg-white text-black px-3 py-1 rounded-full font-bold transition" : "hover:text-white transition";
      });
    }

    window.onload = renderGrid;
  </script>
</body>
</html>
