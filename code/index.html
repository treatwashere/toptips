<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Tips</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom CSS file link -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">
  
  <header class="border-b border-gray-800 p-6 flex justify-between items-center">
    <h1 class="text-2xl font-bold tracking-tight">Top Tips</h1>
    <nav class="space-x-4 text-sm text-gray-400">
      <a href="#" class="hover:text-white">Icons</a>
      <a href="#" class="hover:text-white">Documentation</a>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-12">
    <div class="text-center mb-12">
      <h2 class="text-4xl font-extrabold tracking-tight sm:text-5xl">Heroicons-style UI</h2>
      <p class="mt-4 text-lg text-gray-400">Custom icon library and reference set.</p>
    </div>

    <!-- Icon Grid Container -->
    <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-6">
      <!-- Example Icon Card -->
      <div class="flex flex-col items-center justify-center p-4 bg-gray-800/50 rounded-xl border border-gray-700/50 hover:border-gray-500 transition">
        <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span class="mt-2 text-xs text-gray-300">check</span>
      </div>
    </div>
  </main>

</body>
</html>
